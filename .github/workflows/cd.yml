name: CD

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    name: Build and Test
    uses: ./.github/workflows/quarkus-build-and-test.yml

  docker-build-and-push:
    name: Docker Build, Test and Push
    needs: build-and-test
    uses: ./.github/workflows/docker-build-test.yml
    with:
      push: true
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
