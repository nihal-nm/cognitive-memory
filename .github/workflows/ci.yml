name: CI

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      
      - name: Build with Maven
        run: ./mvnw -B clean package -DskipTests
        working-directory: cognition-processor-quarkus
      
      - name: Run tests
        run: ./mvnw -B test
        working-directory: cognition-processor-quarkus
