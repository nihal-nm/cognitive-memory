name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and Test
    uses: ./.github/workflows/quarkus-build-and-test.yml

  docker-build-and-test:
    name: Docker Build and Health Check
    needs: build-and-test
    uses: ./.github/workflows/docker-build-test.yml
    with:
      push: false
