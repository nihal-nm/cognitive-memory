name: Build and Test

on:
  workflow_call:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: ./mvnw -B clean package -DskipTests
        working-directory: cognition-processor-quarkus

      - name: Run tests
        run: ./mvnw -B test
        working-directory: cognition-processor-quarkus

      - name: Generate coverage report
        if: runner.os == 'Linux'
        run: ./mvnw -B jacoco:report
        working-directory: cognition-processor-quarkus

      - name: Coverage summary
        if: runner.os == 'Linux' && always()
        run: |
          REPORT="cognition-processor-quarkus/target/site/jacoco/jacoco.xml"
          if [ ! -f "$REPORT" ]; then
            echo "::warning::No JaCoCo coverage data — no tests were executed"
            echo "## Code Coverage" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> **No coverage data available.** JaCoCo found no test execution data." >> "$GITHUB_STEP_SUMMARY"
            echo "> Add tests under \`src/test/java\` to enable coverage reporting." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Coverage report
        if: runner.os == 'Linux' && always() && hashFiles('cognition-processor-quarkus/target/site/jacoco/jacoco.xml') != ''
        uses: Madrapps/jacoco-report@v1.7.2
        with:
          paths: cognition-processor-quarkus/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          comment-type: summary
          min-coverage-overall: 80
          min-coverage-changed-files: 80
          title: Code Coverage
          continue-on-error: true

      - name: Run Checkstyle
        if: runner.os == 'Linux'
        run: ./mvnw -B checkstyle:checkstyle
        working-directory: cognition-processor-quarkus

      - name: Run SpotBugs
        if: runner.os == 'Linux'
        run: ./mvnw -B spotbugs:spotbugs
        working-directory: cognition-processor-quarkus

      - name: Annotate Checkstyle findings
        if: runner.os == 'Linux' && always()
        uses: motlin/checkstyle-results@v1
        with:
          checkstyle_files: cognition-processor-quarkus/target/checkstyle-result.xml

      - name: Annotate SpotBugs findings
        if: runner.os == 'Linux' && always()
        uses: ./.github/actions/spotbugs-reporter
        with:
          spotbugs_files: cognition-processor-quarkus/target/spotbugsXml.xml

      - name: Fail on quality issues
        if: runner.os == 'Linux'
        run: ./mvnw -B checkstyle:check spotbugs:check
        working-directory: cognition-processor-quarkus
