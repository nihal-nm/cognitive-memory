name: Docker Build and Test

on:
  workflow_call:
    inputs:
      push:
        description: 'Push the image to Quay.io after a successful health check'
        type: boolean
        required: true
      quay_repo:
        description: 'Quay.io repository path (e.g. rigazilla/cognitive-memory)'
        type: string
        default: 'rigazilla/cognitive-memory'
    secrets:
      QUAY_USERNAME:
        required: false
      QUAY_TOKEN:
        required: false

jobs:
  test-architecture:
    name: Test Docker Image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build application
        run: ./mvnw -B clean package -DskipTests
        working-directory: cognition-processor-quarkus

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Docker image for ${{ matrix.platform }}
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: ./cognition-processor-quarkus
          file: ./cognition-processor-quarkus/src/main/docker/Dockerfile.jvm
          platforms: ${{ matrix.platform }}
          load: true
          tags: local-test:latest
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Start container for health check
        run: |
          docker run -d --name test-container \
            -p 8090:8090 \
            -e QUARKUS_HTTP_PORT=8090 \
            -e MEMORY_SERVICE_GRPC_HOST=localhost \
            -e MEMORY_SERVICE_GRPC_PORT=8082 \
            -e MEMORY_SERVICE_API_KEY=test-key-for-health-check \
            -e COGNITION_OPENAI_API_KEY=dummy-key-for-health-check \
            -e QUARKUS_LOG_FILE_ENABLE=false \
            "local-test:latest"

      - name: Wait for container to be ready
        run: |
          echo "Waiting for container to start..."
          sleep 10
          for i in {1..30}; do
            if curl -f http://localhost:8090/q/health/live 2>/dev/null; then
              echo "Container is live on ${{ matrix.platform }}!"
              exit 0
            fi
            echo "Attempt $i: Container not live yet..."
            sleep 2
          done
          echo "Container failed to become live on ${{ matrix.platform }}"
          docker logs test-container
          exit 1

      - name: Stop test container
        if: always()
        run: |
          if docker ps -a --format '{{.Names}}' | grep -q '^test-container$'; then
            docker stop test-container && docker rm test-container
          else
            echo "Container test-container does not exist, skipping cleanup"
          fi

  push-multiarch:
    name: Build and Push Multi-arch Image
    needs: test-architecture
    runs-on: ubuntu-latest
    if: inputs.push

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build application
        run: ./mvnw -B clean package -DskipTests
        working-directory: cognition-processor-quarkus

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Quay.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: quay.io/${{ inputs.quay_repo }}
          tags: |
            type=ref,event=pr,prefix=pr-
            type=ref,event=branch
            type=sha,prefix=pr-${{ github.event.pull_request.number }}-,enable=${{ github.event_name == 'pull_request' }}
            type=sha,prefix={{branch}}-,enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=cd-latest,enable=${{ github.event_name != 'pull_request' }}

      - name: Push multi-arch Docker image to Quay.io
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: ./cognition-processor-quarkus
          file: ./cognition-processor-quarkus/src/main/docker/Dockerfile.jvm
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=linux/amd64
          cache-to: type=gha,mode=max
