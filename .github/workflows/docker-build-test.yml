name: Docker Build and Test

on:
  workflow_call:
    inputs:
      push:
        description: 'Push the image to Quay.io after a successful health check'
        type: boolean
        required: true
      quay_repo:
        description: 'Quay.io repository path (e.g. rigazilla/cognitive-memory)'
        type: string
        default: 'rigazilla/cognitive-memory'
    secrets:
      QUAY_USERNAME:
        required: false
      QUAY_TOKEN:
        required: false

jobs:
  docker-build-and-test:
    name: Build, Test and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build application
        run: ./mvnw -B clean package -DskipTests
        working-directory: cognition-processor-quarkus

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Quay.io
        if: inputs.push
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: quay.io/${{ inputs.quay_repo }}
          tags: |
            type=ref,event=pr,prefix=pr-
            type=ref,event=branch
            type=sha,prefix=pr-${{ github.event.pull_request.number }}-,enable=${{ github.event_name == 'pull_request' }}
            type=sha,prefix={{branch}}-,enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=cd-latest,enable=${{ github.event_name != 'pull_request' }}

      - name: Build Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: ./cognition-processor-quarkus
          file: ./cognition-processor-quarkus/src/main/docker/Dockerfile.jvm
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container for health check
        run: |
          # Use the first tag produced by metadata-action as the local image reference
          LOCAL_IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker run -d --name test-container \
            -p 8090:8090 \
            -e QUARKUS_HTTP_PORT=8090 \
            -e MEMORY_SERVICE_GRPC_HOST=localhost \
            -e MEMORY_SERVICE_GRPC_PORT=8082 \
            -e MEMORY_SERVICE_API_KEY=test-key-for-health-check \
            -e COGNITION_OPENAI_API_KEY=dummy-key-for-health-check \
            -e QUARKUS_LOG_FILE_ENABLE=false \
            "$LOCAL_IMAGE"

      - name: Wait for container to be ready
        run: |
          echo "Waiting for container to start..."
          sleep 10
          for i in {1..30}; do
            if curl -f http://localhost:8090/q/health/live 2>/dev/null; then
              echo "Container is live!"
              exit 0
            fi
            echo "Attempt $i: Container not live yet..."
            sleep 2
          done
          echo "Container failed to become live"
          docker logs test-container
          exit 1

      - name: Stop test container
        if: always()
        run: |
          if docker ps -a --format '{{.Names}}' | grep -q '^test-container$'; then
            docker stop test-container && docker rm test-container
          else
            echo "Container test-container does not exist, skipping cleanup"
          fi

      - name: Push Docker image to Quay.io
        if: inputs.push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: ./cognition-processor-quarkus
          file: ./cognition-processor-quarkus/src/main/docker/Dockerfile.jvm
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
